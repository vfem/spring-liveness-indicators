spring:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers}

management:
  health:
    livenessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

liveness:
  kafka:
    admin-timeout-ms: 3000

logging:
  level:
    org.springframework.kafka.listener: info
    org.livenesscheck.kafka.spring: trace